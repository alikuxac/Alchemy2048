name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test common logic
        run: ./gradlew :common:test --stacktrace

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [neoforge, forge]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.loader }}
        run: ./gradlew :${{ matrix.loader }}:build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: alchemy2048-${{ matrix.loader }}-${{ github.sha }}
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error