subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://files.minecraftforge.net/maven' }
        maven { name = "Illusive Soulworks maven"; url = "https://maven.theillusivec4.top/" }
        maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
    }
}

def publishModsEnabled = providers.gradleProperty('publishModsArgs').isPresent()

subprojects {
    if (!publishModsEnabled) {
        return
    }
    apply plugin: 'java-library'
    apply plugin: 'me.modmuss50.mod-publish-plugin'

    tasks.register('publishMods', me.modmuss50.mpp.PublishModTask) {
        file = tasks.named('jar').flatMap { it.archiveFile }
        displayName = "${rootProject.mod_name} ${rootProject.mod_version}"
        version = "${rootProject.mod_version}+mc${rootProject.minecraft_version}"
        changelog = providers.environmentVariable('RELEASE_BODY').orElse('')
        type = me.modmuss50.mpp.ReleaseType.STABLE
        modLoaders.add(project.name)
        minecraftVersions.add(rootProject.minecraft_version)

        def ids = providers.gradleProperty('publishModsArgs').get().split('\\s+')
        def dryRun = ids.find { it.startsWith('--dry-run') }
        def modrinthId = ids.find { it.startsWith('--modrinth-id=') }?.split('=', 2)?.getAt(1)
        def curseforgeId = ids.find { it.startsWith('--curseforge-id=') }?.split('=', 2)?.getAt(1)

        if (dryRun) {
            def url = dryRun.split('=', 2)[1]
            modrinth {
                projectId = 'dry-run'
                accessToken = 'dry-run'
                dryRun = true
                dryRunUploadUrl = url
            }
            curseforge {
                projectId = 'dry-run'
                accessToken = 'dry-run'
                dryRun = true
                dryRunUploadUrl = url
            }
        } else {
            if (modrinthId) {
                modrinth {
                    projectId = modrinthId
                    accessToken = providers.environmentVariable('MODRINTH_TOKEN')
                }
            }
            if (curseforgeId) {
                curseforge {
                    projectId = curseforgeId
                    accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
                }
            }
        }
    }
}
