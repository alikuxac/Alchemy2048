plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.21'
}

group = rootProject.mod_group_id
version = rootProject.mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.java_version)
    }
    withSourcesJar()
}

neoForge {
    neoFormVersion = rootProject.neoform_version

    parchment {
        minecraftVersion = rootProject.parchment_minecraft_version
        mappingsVersion = rootProject.parchment_mappings_version
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
